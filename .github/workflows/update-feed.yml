
name: Update project37 medical feed

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch new medical updates
        run: python scripts/fetch_updates.py

      - name: Save new updates
        run: |
          if [[ -n "$(git status --porcelain updates.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add updates.json
            git commit -m "Update medical news feed"
            git push
          else
            echo "No new updates."
          fi
