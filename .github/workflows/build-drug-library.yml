
name: Build Project37 Drug Library

on:
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * *"

  push:
    branches:
      - main
    paths:
      - "drugs.json"
      - "drug_catalog.json"
      - "drug_topics.json"
      - "project37_expansion.json"
      - "scripts/build_master_drugs.py"
      - ".github/workflows/build-drug-library.yml"

permissions:
  contents: write

concurrency:
  group: project37-drug-library
  cancel-in-progress: false

jobs:
  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build master drug database
        run: python scripts/build_master_drugs.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add master_drugs.json

          if git diff --cached --quiet; then
            echo "No database changes detected"
          else
            git commit -m "Update Project37 master drug library"
            git pull --rebase origin main
            git push origin main
          fi
